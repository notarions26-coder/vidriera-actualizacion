<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ducado Kong - Reloj Casio & Vidriera MDP</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        digital: ['"VT323"', 'monospace'],
                        futuristic: ['"Orbitron"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .lcd-screen {
            background-color: #9ead86;
            color: #111811;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s ease, color 0.3s ease, text-shadow 0.3s ease;
        }
        .lcd-screen.light-on {
            background-color: #22d3ee;
            color: #02232b;
            text-shadow: 0 0 8px rgba(34, 211, 238, 0.8);
        }
        .casio-body {
            background: linear-gradient(135deg, #1f2937 0%, #111827 50%, #030712 100%);
            box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 2px 3px rgba(255,255,255,0.1);
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center justify-between p-4 selection:bg-amber-500 selection:text-black">

    <header class="w-full max-w-5xl text-center py-6">
        <h1 class="font-futuristic font-black text-3xl md:text-5xl tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-orange-500 to-red-600 drop-shadow-lg">
            DUCADO KONG
        </h1>
        <p class="font-mono text-sm md:text-base text-amber-400/80 tracking-widest mt-1">
            CLUB MISTER KONG - MDP
        </p>
    </header>

    <main class="w-full max-w-5xl flex flex-col lg:flex-row gap-8 items-start justify-center my-auto">

        <!-- RELOJ ESTILO CASIO -->
        <div class="casio-body w-full lg:w-80 rounded-3xl p-6 border-4 border-gray-800 flex flex-col items-center shadow-2xl relative shrink-0 mx-auto">
            <div class="absolute top-3 left-3 w-2 h-2 rounded-full bg-gray-600 shadow-inner"></div>
            <div class="absolute top-3 right-3 w-2 h-2 rounded-full bg-gray-600 shadow-inner"></div>
            
            <div class="text-center mb-4">
                <span class="text-xs font-bold tracking-widest text-amber-500 uppercase">CASIO</span>
                <h2 class="text-sm font-semibold tracking-wider text-gray-300">WATER RESIST</h2>
            </div>

            <!-- Pantalla LCD -->
            <div id="lcd" class="lcd-screen w-full rounded-lg p-3 flex flex-col items-center justify-center border-2 border-gray-700 relative overflow-hidden">
                <div class="text-[10px] font-mono tracking-tighter text-center uppercase font-bold opacity-90 mb-1">
                    CLUB MISTER KONG TE DA LA HORA
                </div>

                <div class="flex justify-between w-full px-2 text-xs font-mono font-bold opacity-80">
                    <span id="date-day">LUN</span>
                    <span id="date-num">02 NOV</span>
                </div>

                <div class="font-digital text-5xl md:text-6xl tracking-widest my-1 flex items-center">
                    <span id="hours">12</span>:<span id="minutes">00</span><span class="text-2xl ml-1" id="seconds">00</span>
                    <span class="text-xs ml-2 font-mono self-end mb-2" id="ampm">PM</span>
                </div>
            </div>

            <div class="flex justify-between w-full mt-6 px-2">
                <button onclick="toggleLight()" class="bg-gray-800 hover:bg-gray-700 active:scale-95 text-xs text-amber-400 font-bold px-3 py-1.5 rounded border border-gray-700 shadow transition cursor-pointer">
                    LIGHT
                </button>
                <button onclick="updateClock()" class="bg-gray-800 hover:bg-gray-700 active:scale-95 text-xs text-gray-300 font-bold px-3 py-1.5 rounded border border-gray-700 shadow transition cursor-pointer">
                    MODE
                </button>
            </div>
        </div>

        <!-- VIDRIERA Y SELLADOR DIGITAL -->
        <div class="w-full flex-1 bg-gray-900/80 border border-gray-800 rounded-2xl p-6 shadow-xl flex flex-col gap-4">
            <h3 class="font-futuristic text-lg text-amber-400 border-b border-gray-800 pb-2 flex justify-between items-center">
                <span>Vidriera & Sello Oficial</span>
                <span class="text-xs font-mono text-gray-400">Mr.Kong Club Mdp</span>
            </h3>

            <!-- Selector de Imagen -->
            <div class="flex flex-col gap-2">
                <label class="text-xs text-gray-300 font-medium">Cargar imagen PNG para la vidriera:</label>
                <input type="file" id="fileInput" accept="image/png, image/jpeg" class="block w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-gray-950 hover:file:bg-amber-400 cursor-pointer bg-gray-950/60 rounded-lg border border-gray-800 p-1"/>
            </div>

            <!-- Canvas de previsualización -->
            <div class="relative w-full aspect-video bg-black/60 rounded-lg overflow-hidden border border-gray-800 flex items-center justify-center min-h-[220px]">
                <canvas id="canvasPreview" class="max-h-full max-w-full object-contain hidden"></canvas>
                <div id="placeholderText" class="text-xs text-gray-500 text-center px-4">
                    Seleccioná tu imagen PNG para visualizarla con la hora exacta y el sello de Ducado Kong.
                </div>
            </div>

            <!-- Botón de Descarga -->
            <button id="downloadBtn" onclick="downloadImage()" disabled class="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 disabled:from-gray-800 disabled:to-gray-800 disabled:text-gray-600 text-gray-950 font-bold py-3 px-4 rounded-xl transition shadow-lg cursor-pointer disabled:cursor-not-allowed">
                Descargar Imagen Con Sello y Hora Exacta
            </button>
        </div>

    </main>

    <footer class="w-full max-w-5xl text-center py-4 text-xs text-gray-600 font-mono">
        Ducado Kong - Mr.Kong Club Mdp © 2026
    </footer>

    <script>
        let lightState = false;
        let loadedImg = null;

        // Reloj Casio
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12;
            const formattedHours = String(hours).padStart(2, '0');

            document.getElementById('hours').innerText = formattedHours;
            document.getElementById('minutes').innerText = minutes;
            document.getElementById('seconds').innerText = seconds;
            document.getElementById('ampm').innerText = ampm;

            const days = ['DOM', 'LUN', 'MAR', 'MIÉ', 'JUE', 'VIE', 'SÁB'];
            const months = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC'];
            
            document.getElementById('date-day').innerText = days[now.getDay()];
            document.getElementById('date-num').innerText = `${String(now.getDate()).padStart(2, '0')} ${months[now.getMonth()]}`;
        }

        setInterval(updateClock, 1000);
        updateClock();

        function toggleLight() {
            lightState = !lightState;
            const lcd = document.getElementById('lcd');
            if (lightState) {
                lcd.classList.add('light-on');
            } else {
                lcd.classList.remove('light-on');
            }
        }

        // Manejo del Canvas
        const fileInput = document.getElementById('fileInput');
        const canvas = document.getElementById('canvasPreview');
        const ctx = canvas.getContext('2d');
        const placeholderText = document.getElementById('placeholderText');
        const downloadBtn = document.getElementById('downloadBtn');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    loadedImg = new Image();
                    loadedImg.onload = function() {
                        placeholderText.classList.add('hidden');
                        canvas.classList.remove('hidden');
                        renderCanvas();
                        downloadBtn.disabled = false;
                    }
                    loadedImg.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        function renderCanvas() {
            if (!loadedImg) return;

            canvas.width = loadedImg.width;
            canvas.height = loadedImg.height;

            ctx.drawImage(loadedImg, 0, 0);

            // Sello Ducado Kong - Mr.Kong Club Mdp + Hora Exacta
            const padding = Math.max(20, canvas.width * 0.03);
            const fontSize = Math.max(16, Math.floor(canvas.width * 0.025));
            
            ctx.font = `bold ${fontSize}px sans-serif`;
            const text1 = "Ducado Kong - Mr.Kong Club Mdp";
            
            const now = new Date();
            const timeString = now.toLocaleDateString() + ' - ' + now.toLocaleTimeString();
            const text2 = `Hora Exacta: ${timeString}`;

            const textWidth1 = ctx.measureText(text1).width;
            const textWidth2 = ctx.measureText(text2).width;
            const maxTextWidth = Math.max(textWidth1, textWidth2);

            const boxWidth = maxTextWidth + padding * 2;
            const boxHeight = fontSize * 3.2 + padding * 1.5;
            const boxX = canvas.width - boxWidth - padding;
            const boxY = canvas.height - boxHeight - padding;

            ctx.fillStyle = "rgba(10, 10, 10, 0.88)";
            ctx.strokeStyle = "#f59e0b";
            ctx.lineWidth = Math.max(2, canvas.width * 0.003);
            
            ctx.beginPath();
            ctx.roundRect(boxX, boxY, boxWidth, boxHeight, 8);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = "#f59e0b";
            ctx.fillText(text1, boxX + padding, boxY + padding + fontSize);

            ctx.font = `${Math.floor(fontSize * 0.85)}px monospace`;
            ctx.fillStyle = "#ffffff";
            ctx.fillText(text2, boxX + padding, boxY + padding + fontSize * 2.2);
        }

        function downloadImage() {
            if (!loadedImg) return;
            renderCanvas();
            const link = document.createElement('a');
            link.download = 'ducado-kong-sellada.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
